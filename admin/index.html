<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zodiac Box Admin</title><link rel="stylesheet" href="../assets/styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script src="../assets/config.js"></script><script defer src="../assets/app.js"></script></head><body><main class="shell"><section id="loginView" class="panel login"><div class="hero" style="padding-top:0"><div class="game-icon">⚙️</div><div class="eyebrow">The Zodiac Box</div><h1 style="font-size:2.5rem">Admin</h1><p>Manage games, prize odds, and customer rewards.</p></div><form id="loginForm" class="form-grid"><label class="field" style="grid-column:1/-1"><span>Email</span><input id="email" type="email" autocomplete="username" required></label><label class="field" style="grid-column:1/-1"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><button style="grid-column:1/-1">Sign in</button></form><div id="loginMsg" style="margin-top:10px"></div></section><section id="adminView" class="hidden"><header class="admin-top"><div><div class="eyebrow">The Zodiac Box</div><h1 style="margin:.2rem 0">Game Admin</h1><p class="small">Control game days, prize percentages, customer winnings, and fulfillment.</p></div><div class="actions"><a class="btn secondary" href="../">View Game Room</a><button id="logout" class="secondary">Sign out</button></div></header><section class="panel"><div class="tabs"><button data-tab="dashboard" class="secondary active">Dashboard</button><button data-tab="games" class="secondary">Games</button><button data-tab="prizes" class="secondary">Prize Odds</button><button data-tab="unclaimed" class="secondary">Waiting Prizes</button><button data-tab="lookup" class="secondary">Customer Lookup</button><button data-tab="history" class="secondary">History</button></div></section><div id="message"></div><section id="dashboard" class="tabpane"></section><section id="games" class="tabpane hidden"></section><section id="prizes" class="tabpane hidden"></section><section id="unclaimed" class="tabpane hidden"></section><section id="lookup" class="tabpane hidden"></section><section id="history" class="tabpane hidden"></section></section></main><script>
window.addEventListener('load',()=>{
 const sb=ZB.supa(),loginView=document.querySelector('#loginView'),adminView=document.querySelector('#adminView'),msg=document.querySelector('#message'); let games=[],prizes=[],players=[],plays=[];
 const esc=ZB.esc; const notify=(t,kind='success')=>{msg.innerHTML=`<div class="${kind}">${esc(t)}</div>`;setTimeout(()=>{msg.innerHTML=''},4000)};
 async function isAdmin(user){if(!user)return false;const {data,error}=await sb.from('admin_users').select('user_id,role,display_name').eq('user_id',user.id).maybeSingle();return !error&&!!data}
 async function boot(){const {data:{session}}=await sb.auth.getSession();const ok=await isAdmin(session?.user);loginView.classList.toggle('hidden',ok);adminView.classList.toggle('hidden',!ok);if(ok)await refreshAll()}
 document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#loginMsg');out.textContent='Signing in…';const {data,error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value});if(error){out.innerHTML=`<div class="error">${esc(error.message)}</div>`;return}if(!(await isAdmin(data.user))){await sb.auth.signOut();out.innerHTML='<div class="error">This account is not authorized as a Zodiac Box admin.</div>';return}out.textContent='';boot()});
 document.querySelector('#logout').addEventListener('click',async()=>{await sb.auth.signOut();boot()});
 document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.tabpane').forEach(p=>p.classList.toggle('hidden',p.id!==b.dataset.tab));renderAll()}));
 async function refreshAll(){const [g,p,pl,py]=await Promise.all([sb.from('games').select('*').order('day_of_week'),sb.from('prizes').select('*').order('sort_order').order('created_at'),sb.from('players').select('*').order('last_seen_at',{ascending:false}),sb.from('plays').select('*, games(name,slug), prizes(name,is_no_win), players(tiktok_username,display_name)').order('played_at',{ascending:false})]);for(const x of [g,p,pl,py])if(x.error)throw x.error;games=g.data||[];prizes=p.data||[];players=pl.data||[];plays=py.data||[];renderAll()}
 function renderAll(){renderDashboard();renderGames();renderPrizes();renderUnclaimed();renderLookup();renderHistory()}
 function renderDashboard(){const waiting=plays.filter(p=>p.fulfillment_status==='waiting_for_order').length,fulfilled=plays.filter(p=>p.fulfillment_status==='fulfilled').length,nowin=plays.filter(p=>p.prizes?.is_no_win).length;document.querySelector('#dashboard').innerHTML=`<section class="panel"><h2>Overview</h2><div class="kpis"><div class="kpi"><span class="small">Active games</span><strong>${games.filter(g=>g.is_active).length}</strong></div><div class="kpi"><span class="small">TikTok players</span><strong>${players.length}</strong></div><div class="kpi"><span class="small">Waiting prizes</span><strong>${waiting}</strong></div><div class="kpi"><span class="small">Fulfilled</span><strong>${fulfilled}</strong></div></div><p class="small">No-prize outcomes recorded: ${nowin}</p></section><section class="panel"><h2>When an order says GAME PRIZE WON</h2><p>Open <b>Customer Lookup</b>, search the TikTok username once, and the system will show every result connected to that account. If they won more than one prize, you can fulfill all waiting prizes with the same TikTok Shop order number in one click.</p></section>`}
 function renderGames(){const el=document.querySelector('#games');el.innerHTML='<section class="panel"><h2>Game Settings</h2><p class="small">Set which day each game opens, its hours, and whether it is currently active.</p><div class="admin-list" id="gameList"></div></section>';const list=document.querySelector('#gameList');games.forEach(g=>{const row=document.createElement('div');row.className='admin-item';row.dataset.id=g.id;row.innerHTML=`<div class="form-grid"><label class="field"><span>Game name</span><input class="name" value="${esc(g.name)}"></label><label class="field"><span>Active</span><select class="active"><option value="true" ${g.is_active?'selected':''}>Yes</option><option value="false" ${!g.is_active?'selected':''}>No</option></select></label><label class="field"><span>Day</span><select class="day">${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map((d,i)=>`<option value="${i}" ${Number(g.day_of_week)===i?'selected':''}>${d}</option>`).join('')}</select></label><label class="field"><span>Plays allowed each game period</span><input class="maxplays" type="number" min="1" value="${g.max_plays_per_period}"></label><label class="field"><span>Opens</span><input class="opens" type="time" value="${(g.opens_at||'00:00').slice(0,5)}"></label><label class="field"><span>Closes</span><input class="closes" type="time" value="${(g.closes_at||'23:59').slice(0,5)}"></label><label class="field" style="grid-column:1/-1"><span>Customer instructions</span><textarea class="instructions">${esc(g.instructions||'')}</textarea></label></div><div class="actions" style="margin-top:10px"><button class="saveGame">Save game</button></div>`;list.appendChild(row)});document.querySelectorAll('.saveGame',el).forEach(b=>b.addEventListener('click',async()=>{const row=b.closest('[data-id]');const patch={name:row.querySelector('.name').value.trim(),is_active:row.querySelector('.active').value==='true',day_of_week:Number(row.querySelector('.day').value),max_plays_per_period:Number(row.querySelector('.maxplays').value)||1,opens_at:row.querySelector('.opens').value,closes_at:row.querySelector('.closes').value,instructions:row.querySelector('.instructions').value.trim()||null};const {error}=await sb.from('games').update(patch).eq('id',row.dataset.id);if(error)return notify(error.message,'error');notify('Game settings saved.');await refreshAll()}))}
 function pctFor(p,gp){const active=gp.filter(x=>x.is_active&&Number(x.weight)>0&&(x.inventory_limit==null||Number(x.inventory_awarded)<Number(x.inventory_limit)));const total=active.reduce((n,x)=>n+Number(x.weight),0);return total&&p.is_active?(Number(p.weight)/total*100):0}
 function renderPrizes(){const el=document.querySelector('#prizes');el.innerHTML='<section class="panel"><h2>Prize Percentages</h2><p>Each game can have different prizes and odds. The system automatically turns the numbers into percentages, so they do not have to add to exactly 100.</p><div class="notice"><strong>Recommended:</strong> Keep one or two high-value prizes much lower than the regular prizes. The <b>Stars Didn’t Align</b> option is a real game outcome but is never treated as a prize you owe.</div><div id="prizeGroups"></div></section>';const groups=document.querySelector('#prizeGroups');games.forEach(g=>{const gp=prizes.filter(p=>p.game_id===g.id);const total=gp.filter(p=>p.is_active).reduce((n,p)=>n+Number(p.weight||0),0);groups.insertAdjacentHTML('beforeend',`<div class="admin-item" data-game="${g.id}" style="margin-top:14px"><div class="admin-top"><div><h3 style="margin:.1rem 0">${esc(g.name)}</h3><p class="small">Current entered total: ${total.toFixed(1)} • Actual chances normalize to 100%</p></div><button class="addPrize">+ Add Prize</button></div><div class="prizeRows">${gp.map(p=>`<div class="prize-row" data-prize="${p.id}"><label class="field wide"><span>Outcome / prize name</span><input class="pname" value="${esc(p.name)}"></label><label class="field"><span>Chance number</span><input class="pweight" type="number" min="0" step="0.1" value="${p.weight}"></label><div class="field"><span>Actual chance</span><div class="odds-badge">${pctFor(p,gp).toFixed(1)}%</div></div><label class="field"><span>Active</span><select class="pactive"><option value="true" ${p.is_active?'selected':''}>Yes</option><option value="false" ${!p.is_active?'selected':''}>No</option></select></label><label class="field"><span>Outcome type</span><select class="pnowin"><option value="false" ${!p.is_no_win?'selected':''}>Prize</option><option value="true" ${p.is_no_win?'selected':''}>No prize</option></select></label><label class="field"><span>Inventory cap</span><input class="pcap" type="number" min="0" placeholder="Unlimited" value="${p.inventory_limit??''}"></label><button class="danger removePrize">Remove</button></div>`).join('')||'<p class="small">No prizes yet.</p>'}</div><button class="saveGroup">Save ${esc(g.name)} odds</button></div>`)});document.querySelectorAll('.addPrize').forEach(b=>b.addEventListener('click',async()=>{const group=b.closest('[data-game]'),name=prompt('New prize/outcome name:');if(!name?.trim())return;const chance=Number(prompt('Starting chance number (example: 10):','10'))||10;const {error}=await sb.from('prizes').insert({game_id:group.dataset.game,name:name.trim(),weight:chance,is_active:true,is_no_win:false,sort_order:prizes.filter(p=>p.game_id===group.dataset.game).length+1});if(error)return notify(error.message,'error');notify('Prize added.');await refreshAll()}));document.querySelectorAll('.saveGroup').forEach(b=>b.addEventListener('click',async()=>{const group=b.closest('[data-game]');for(const row of group.querySelectorAll('[data-prize]')){const cap=row.querySelector('.pcap').value.trim();const patch={name:row.querySelector('.pname').value.trim(),weight:Number(row.querySelector('.pweight').value)||0,is_active:row.querySelector('.pactive').value==='true',is_no_win:row.querySelector('.pnowin').value==='true',inventory_limit:cap===''?null:Number(cap)};const {error}=await sb.from('prizes').update(patch).eq('id',row.dataset.prize);if(error)return notify(error.message,'error')}notify('Prize odds saved.');await refreshAll()}));document.querySelectorAll('.removePrize').forEach(b=>b.addEventListener('click',async()=>{const row=b.closest('[data-prize]');if(!confirm('Remove this outcome? If it has already appeared in game history, turn it Off instead.'))return;const {error}=await sb.from('prizes').delete().eq('id',row.dataset.prize);if(error)return notify(error.message,'error');notify('Outcome removed.');await refreshAll()}))}
 function playRows(rows,actions=true){if(!rows.length)return '<p class="small">No game results yet.</p>';return `<div class="table-wrap"><table><thead><tr><th>Game</th><th>Result</th><th>Played</th><th>Status</th><th>Order</th>${actions?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(p=>`<tr><td>${esc(p.games?.name||'')}</td><td><strong>${esc(p.prizes?.name||'')}</strong></td><td>${new Date(p.played_at).toLocaleString()}</td><td><span class="pill ${p.fulfillment_status}">${p.prizes?.is_no_win?'no prize':esc(p.fulfillment_status.replaceAll('_',' '))}</span></td><td>${esc(p.order_reference||'—')}</td>${actions?`<td>${p.fulfillment_status==='waiting_for_order'?`<button data-fulfill="${p.id}">Fulfill</button>`:'—'}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
 function playerName(player){return '@'+(player?.tiktok_username||player?.display_name||'unknown')}
 function customerCard(player,rows){const waiting=rows.filter(p=>p.fulfillment_status==='waiting_for_order'),wins=rows.filter(p=>!p.prizes?.is_no_win),noWins=rows.filter(p=>p.prizes?.is_no_win);return `<div class="customer-card" data-player="${player.id}"><div class="admin-top"><div><h3>${esc(playerName(player))}</h3><p class="small">${wins.length} prize result${wins.length===1?'':'s'} • ${waiting.length} waiting • ${noWins.length} no-prize result${noWins.length===1?'':'s'}</p></div>${waiting.length?`<button data-fulfill-all="${player.id}">Fulfill all ${waiting.length} waiting prize${waiting.length===1?'':'s'}</button>`:''}</div><div style="margin-top:12px">${playRows(rows,true)}</div></div>`}
 function attachFulfill(root){root.querySelectorAll('[data-fulfill]').forEach(b=>b.addEventListener('click',async()=>{const order=prompt('TikTok Shop order number/reference:')||'';const note=prompt('Fulfillment note (optional):')||'';const {error}=await sb.from('plays').update({fulfillment_status:'fulfilled',fulfilled_at:new Date().toISOString(),order_reference:order.trim()||null,fulfillment_note:note.trim()||null}).eq('id',b.dataset.fulfill);if(error)return notify(error.message,'error');notify('Prize marked fulfilled.');await refreshAll()}));root.querySelectorAll('[data-fulfill-all]').forEach(b=>b.addEventListener('click',async()=>{const ids=plays.filter(p=>p.player_id===b.dataset.fulfillAll&&p.fulfillment_status==='waiting_for_order').map(p=>p.id);if(!ids.length)return;const order=prompt(`TikTok Shop order number/reference for all ${ids.length} waiting prizes:`)||'';if(!confirm(`Mark all ${ids.length} waiting prizes as fulfilled on this order?`))return;const {error}=await sb.from('plays').update({fulfillment_status:'fulfilled',fulfilled_at:new Date().toISOString(),order_reference:order.trim()||null}).in('id',ids);if(error)return notify(error.message,'error');notify(`${ids.length} prizes marked fulfilled together.`);await refreshAll()}))}
 function renderUnclaimed(){const el=document.querySelector('#unclaimed'),waiting=plays.filter(p=>p.fulfillment_status==='waiting_for_order'),ids=[...new Set(waiting.map(p=>p.player_id))];el.innerHTML=`<section class="panel"><h2>🎁 Customers With Waiting Prizes</h2><p class="small">Each TikTok customer appears once, even if they won in several games.</p>${ids.length?ids.map(id=>{const player=players.find(x=>x.id===id)||{id,tiktok_username:'unknown'};return customerCard(player,plays.filter(p=>p.player_id===id))}).join(''):'<p class="small">No prizes are waiting right now.</p>'}</section>`;attachFulfill(el)}
 function renderLookup(){const el=document.querySelector('#lookup');el.innerHTML=`<section class="panel"><h2>Customer Lookup</h2><p>Search the TikTok username from an order containing <b>GAME PRIZE WON</b>. You will see every game result connected to that one account.</p><div class="searchbar"><input id="lookupInput" placeholder="@username"><button id="lookupBtn">Search</button></div><div id="lookupResult" style="margin-top:14px"></div></section>`;const go=()=>{const q=document.querySelector('#lookupInput').value.trim().replace(/^@/,'').toLowerCase(),matches=players.filter(p=>(p.tiktok_username||'').toLowerCase().includes(q)||(p.display_name||'').toLowerCase().includes(q));const out=document.querySelector('#lookupResult');out.innerHTML=!q?'<p class="small">Enter a TikTok username.</p>':matches.length?matches.map(p=>customerCard(p,plays.filter(x=>x.player_id===p.id))).join(''):'<div class="error">No TikTok customer found with that name.</div>';attachFulfill(out)};document.querySelector('#lookupBtn').addEventListener('click',go);document.querySelector('#lookupInput').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
 function renderHistory(){document.querySelector('#history').innerHTML=`<section class="panel"><h2>All Game History</h2><p class="small">Includes prizes, fulfilled wins, and no-prize outcomes.</p>${plays.length?`<div class="table-wrap"><table><thead><tr><th>TikTok</th><th>Game</th><th>Result</th><th>Played</th><th>Status</th><th>Order</th></tr></thead><tbody>${plays.map(p=>`<tr><td>@${esc(p.players?.tiktok_username||p.players?.display_name||'unknown')}</td><td>${esc(p.games?.name||'')}</td><td>${esc(p.prizes?.name||'')}</td><td>${new Date(p.played_at).toLocaleString()}</td><td><span class="pill ${p.fulfillment_status}">${p.prizes?.is_no_win?'no prize':esc(p.fulfillment_status.replaceAll('_',' '))}</span></td><td>${esc(p.order_reference||'—')}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small">No game history yet.</p>'}</section>`}
 boot().catch(e=>{document.querySelector('#loginMsg').innerHTML=`<div class="error">${esc(e.message)}</div>`})
});
</script></body></html>
